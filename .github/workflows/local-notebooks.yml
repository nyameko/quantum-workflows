name: Standalone CPU Jupyter notebooks

on:
  pull_request:
    branches: [dev]
    paths:
      - 'labs/01-intro-quantum-computing/**'
      - 'scripts/validate_local_notebooks.py'
      - 'pyproject.toml'
      - 'src/quantum_workflows/**'
      - '.github/workflows/local-notebooks.yml'
  push:
    branches: [dev]
    paths:
      - 'labs/01-intro-quantum-computing/**'
      - 'scripts/validate_local_notebooks.py'
      - 'pyproject.toml'
      - 'src/quantum_workflows/**'
      - '.github/workflows/local-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-local-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[notebooks]'
      - run: python -m pip install 'qiskit[visualization]>=2.5,<3' 'nbclient>=0.10,<1' 'nbformat>=5,<6'
      - run: python scripts/validate_local_notebooks.py
