name: Computational Photonics CPU notebooks

on:
  push:
    branches: [dev, main]
    paths:
      - 'labs/04-zero-to-hero-photonics/**'
      - 'scripts/validate_photonics_lessons.py'
      - 'tests/test_photonics_curriculum.py'
      - '.github/workflows/photonics-notebooks.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'labs/04-zero-to-hero-photonics/**'
      - 'scripts/validate_photonics_lessons.py'
      - 'tests/test_photonics_curriculum.py'
      - '.github/workflows/photonics-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'numpy>=2,<3' 'matplotlib>=3.9,<4' 'nbclient>=0.10,<1' 'nbformat>=5,<6' 'ipykernel>=6,<8' 'pytest>=8,<10'
      - run: python -m pip install 'photonicslab @ git+https://github.com/nyameko/photonicslab.git@141258d308b11569b37628c003ace15e385fba3d'
      - run: python -m pytest -q tests/test_photonics_curriculum.py
      - run: python scripts/validate_photonics_lessons.py
