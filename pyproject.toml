[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantum-workflows"
version = "0.1.0"
description = "Reproducible hybrid quantum-classical and quantum-centric supercomputing workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nyameko Lisa" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0,<3",
  "qiskit>=2.5,<3",
  "qiskit-aer>=0.17,<0.18",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.49,<0.50"]
qrmi-ibm = ["qrmi[ibm]>=0.23"]
sqd = [
  "ffsim>=0.0.84,<0.1",
  "pyscf>=2.14,<3",
  "qiskit-addon-sqd>=0.13.1,<0.14",
]
notebooks = ["ipykernel>=6", "jupyterlab>=4", "matplotlib>=3.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12"]
[project.scripts]
quantum-workflow = "quantum_workflows.cli:main"
qw = "quantum_workflows.cli:main"

[project.urls]
Repository = "https://github.com/nyameko/quantum-workflows"
Documentation = "https://github.com/nyameko/quantum-workflows/tree/main/docs"
Issues = "https://github.com/nyameko/quantum-workflows/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_workflows"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires the scientific optional dependencies",
  "hardware: consumes remote QPU access and is never run by CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
